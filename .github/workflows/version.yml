name: Coordinated version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardano-on-evm-version-pr
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' && vars.VERSION_PR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: version-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Apply reviewed pending changesets from the captured main commit
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm ci --ignore-scripts
          node scripts/release/version.mjs apply
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, verified 2026-09-11
        with:
          app-id: ${{ vars.VERSION_APP_ID }}
          private-key: ${{ secrets.VERSION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open repository-scoped App PR so ordinary CI runs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: node scripts/release/github-version.mjs
